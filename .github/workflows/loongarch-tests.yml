name: LoongArch regression tests

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loongarch-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  loongarch:
    name: LoongArch tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CROSS: loongarch64-linux-gnu
      QEMU_VERSION: 11.1.1
      QEMU_PREFIX: /home/runner/.local/qemu-11.1.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache LoongArch APT packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-loongarch-apt-${{ hashFiles('.github/workflows/loongarch-tests.yml') }}
          restore-keys: |
            ${{ runner.os }}-loongarch-apt-

      - name: Install LoongArch toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            gcc-14-loongarch64-linux-gnu \
            binutils-loongarch64-linux-gnu \
            ninja-build \
            pkg-config \
            libglib2.0-dev \
            libpixman-1-dev \
            libfdt-dev \
            zlib1g-dev

      - name: Cache QEMU build
        id: qemu-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.local/qemu-11.1.1
          key: ${{ runner.os }}-qemu-loongarch-${{ env.QEMU_VERSION }}

      - name: Build pinned QEMU
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$QEMU_PREFIX"
          curl --fail --location \
            "https://download.qemu.org/qemu-${QEMU_VERSION}.tar.xz" \
            --output "/tmp/qemu-${QEMU_VERSION}.tar.xz"
          tar -xf "/tmp/qemu-${QEMU_VERSION}.tar.xz" -C /tmp
          cd "/tmp/qemu-${QEMU_VERSION}"
          ./configure \
            --target-list=loongarch64-softmmu \
            --prefix="$QEMU_PREFIX" \
            --disable-werror
          make -j"$(nproc)"
          make install

      - name: Add pinned QEMU to PATH
        run: echo "$QEMU_PREFIX/bin" >> "$GITHUB_PATH"

      - name: Set up toolchain command aliases
        run: |
          gcc_bin="$(command -v loongarch64-linux-gnu-gcc-14)"
          sudo ln -sf "$gcc_bin" \
            /usr/local/bin/loongarch64-linux-gnu-gcc

      - name: Verify toolchain and emulator
        run: |
          loongarch64-linux-gnu-gcc --version
          loongarch64-linux-gnu-ld --version
          qemu-system-loongarch64 --version

      - name: List supported tests
        run: python3 scripts/run_tests.py --arch loongarch --list

      - name: Run LoongArch regression tests
        run: |
          python3 scripts/run_tests.py \
            --arch loongarch \
            --rootfs tmpfs \
            --fs-list "tmpfs devtmpfs" \
            -T 30 \
            --log-dir logs

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loongarch-test-logs
          path: logs/
          if-no-files-found: ignore
