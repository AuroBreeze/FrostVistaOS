name: generate website data

on:
  push:
    branches:
      - main
      - dev
    paths:
      - releases.md
      - scripts/generate_website_data.py
      - .github/workflows/website-data.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate roadmap data
        run: python3 scripts/generate_website_data.py

      - name: Upload generated data
        uses: actions/upload-artifact@v4
        with:
          name: website-roadmap-data
          path: website-data/roadmap.json
          if-no-files-found: error
          retention-days: 30
