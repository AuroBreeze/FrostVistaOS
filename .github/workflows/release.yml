name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish or refresh
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Extract changelog section
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          TAG="${RELEASE_TAG#v}"
          python3 - "$TAG" <<'EOF'
          import re
          import sys

          tag = sys.argv[1]
          text = open('CHANGELOG.md', encoding='utf-8').read()

          pattern = re.compile(
              r'^## (v%s[^\n]*)\n(.*?)(?=^## v\d|\Z)' % re.escape(tag),
              re.MULTILINE | re.DOTALL,
          )
          m = pattern.search(text)
          if not m:
              print(f'::error::no CHANGELOG section for v{tag}')
              sys.exit(1)
          title = m.group(1).strip()
          body = m.group(2).strip() + '\n'
          with open('RELEASE_TITLE.txt', 'w', encoding='utf-8') as f:
              f.write(title)
          with open('RELEASE_BODY.md', 'w', encoding='utf-8') as f:
              f.write(body)
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          RELEASE_TITLE="$(cat RELEASE_TITLE.txt)"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file RELEASE_BODY.md
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file RELEASE_BODY.md
          fi
